name: NEXA Local Radar Ledger
on:
  pull_request:
    paths:
      - 'scripts/run-local-radar-ledger.mjs'
      - 'tests/radar-ledger/**'
      - 'nexa-radar-ledger-client.js'
      - 'nexa-radar-ledger-bridge.js'
      - 'nexa-radar-encrypted-outbox.js'
      - 'tests/nexa-radar-ledger-client.test.cjs'
      - 'tests/nexa-radar-ledger-bridge.test.cjs'
      - 'tests/nexa-radar-encrypted-outbox.test.cjs'
      - 'tests/nexa-radar-capture-hook.test.cjs'
      - 'supabase/migrations/20261102092515_nexa_radar_question_event_ledger_candidate.sql'
      - '.github/workflows/nexa-radar-ledger-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Exercise 500 synthetic events with local Auth roles and RLS
        run: node scripts/run-local-radar-ledger.mjs
      - name: Verify candidate bridge, encrypted queue and visual-cap capture
        run: node --test tests/nexa-radar-ledger-client.test.cjs tests/nexa-radar-ledger-bridge.test.cjs tests/nexa-radar-encrypted-outbox.test.cjs tests/nexa-radar-capture-hook.test.cjs
