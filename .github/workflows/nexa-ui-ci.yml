name: NEXA UI CI

on:
  workflow_dispatch:
    inputs:
      medication_asr_benchmark:
        description: 'Run synthetic medication ASR benchmark with test-only API key'
        type: boolean
        default: false
      medication_staging_gate:
        description: 'Run authenticated synthetic medication gate on protected staging'
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - "audit/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clinical-regression-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Clinical hotfix syntax and contracts
        run: |
          node --check index.html 2>/dev/null || true
          node --check nexa-final-ui-v18.js
          node --check nexa-radar-auto-review-v18.12.js
          node --check nexa-encounter-autosave-v18.10.1.js
          node --check nexa-audit-outbox-v18.9.19.js
          node --check nexa-history-style-audit-v18.9.7.js
          node tests/nexa-clinical-regression-hotfix.contract.test.mjs
          node tests/nexa-auditor-consent-hotfix.contract.test.mjs
          node tests/nexa-audit-outbox.contract.test.mjs
          node tests/nexa-inline-syntax.test.mjs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno Edge Function typecheck
        run: |
          deno check supabase/functions/process-consultation/index.ts
          deno check supabase/functions/realtime-call/index.ts
          deno check supabase/functions/realtime-radar/index.ts
          deno check supabase/functions/submit-audit-case/index.ts
          deno check supabase/functions/audit-backfill/index.ts
          deno check supabase/functions/consultation-speakers/index.ts
          deno check supabase/functions/core-dataset-export/index.ts
      - name: Install focused browser
        run: npx playwright install --with-deps chromium
      - name: Processing History Audit sequential E2E
        run: node tests/nexa-clinical-regression-hotfix.e2e.cjs
      - name: Auditor sidebar and visible consent E2E
        run: node tests/nexa-continuous-soap.e2e.cjs && node tests/nexa-audit-responsive.e2e.cjs
      - name: Recover clinical history after browser restart without remembered login
        run: node tests/nexa-history-audit-recovery.e2e.cjs
      - name: Save focused browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-regression-focused
          path: test-results/
          retention-days: 7

  validate-ui:
    needs: clinical-regression-focused
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check:js
      - name: UI contract tests
        run: npm test
      - name: Lint, backend typecheck and static build
        run: npm run lint && npm run typecheck && npm run build
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Safari WebKit auditor regression
        run: npm run test:audit-webkit
      - name: Save real browser captures from synthetic regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-browser-regression
          path: test-results/
          retention-days: 7
      - name: Guard against duplicate visual loaders
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'nexa-final-ui-v18.js' nexa-hotfix.js | wc -l | tr -d ' ')" = "1"
          ! grep -q 'nexa-runtime-consolidated-v14.js' nexa-hotfix.js
          ! grep -q 'nexa-approved-ui-v15.js' nexa-hotfix.js
          ! grep -q 'nexa-parity-v17.js' nexa-hotfix.js
          echo 'Single visual shell: PASS'


  staging-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Staging authorization and clinical routes
        env:
          NEXA_STAGING_EMAIL: ${{ secrets.NEXA_STAGING_EMAIL }}
          NEXA_STAGING_PASSWORD: ${{ secrets.NEXA_STAGING_PASSWORD }}
        run: npm run test:staging-auth

  medication-asr-synthetic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.medication_asr_benchmark && github.ref == 'refs/heads/feature/medication-fidelity-20261101' }}
    runs-on: macos-latest
    environment: nexa-asr-synthetic
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate and validate synthetic WAV corpus
        env:
          NEXA_AUDIO_FIXTURE_DIR: ${{ runner.temp }}/nexa-medication-audio
        run: node scripts/generate-medication-audio-fixtures.mjs
      - name: Compare synthetic ASR without and with context
        env:
          OPENAI_API_KEY: ${{ secrets.NEXA_ASR_TEST_API_KEY }}
          NEXA_AUDIO_FIXTURE_DIR: ${{ runner.temp }}/nexa-medication-audio
          NEXA_ASR_BENCHMARK_REPORT: ${{ runner.temp }}/nexa-medication-asr-benchmark.json
        run: node scripts/benchmark-medication-asr.mjs
      - name: Save aggregate synthetic metrics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medication-asr-synthetic-metrics
          path: ${{ runner.temp }}/nexa-medication-asr-benchmark.json
          retention-days: 7
      - name: Remove temporary synthetic audio
        if: always()
        run: rm -f "$RUNNER_TEMP"/nexa-medication-audio/*.wav "$RUNNER_TEMP"/nexa-medication-audio/*.aiff

  medication-staging-synthetic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.medication_staging_gate && github.ref == 'refs/heads/feature/medication-fidelity-20261101' }}
    runs-on: macos-latest
    environment: nexa-medication-staging
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate and validate synthetic WAV corpus
        env:
          NEXA_AUDIO_FIXTURE_DIR: ${{ runner.temp }}/nexa-medication-audio
        run: node scripts/generate-medication-audio-fixtures.mjs
      - name: Process and recover synthetic medication encounter
        env:
          NEXA_SYNTHETIC_ACCOUNT: '1'
          NEXA_STAGING_EMAIL: ${{ secrets.NEXA_MEDICATION_STAGING_SYNTHETIC_EMAIL }}
          NEXA_STAGING_PASSWORD: ${{ secrets.NEXA_MEDICATION_STAGING_SYNTHETIC_PASSWORD }}
          NEXA_AUDIO_FIXTURE_DIR: ${{ runner.temp }}/nexa-medication-audio
        run: npm run test:medication-staging
      - name: Remove temporary synthetic audio
        if: always()
        run: rm -f "$RUNNER_TEMP"/nexa-medication-audio/*.wav "$RUNNER_TEMP"/nexa-medication-audio/*.aiff
