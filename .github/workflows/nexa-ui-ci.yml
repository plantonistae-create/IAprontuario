name: NEXA UI CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "audit/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check:js
      - name: UI contract tests
        run: npm test
      - name: Lint, backend typecheck and static build
        run: npm run lint && npm run typecheck && npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        run: npm run test:e2e
      - name: Save real browser captures from synthetic regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-browser-regression
          path: test-results/
          retention-days: 7
      - name: Guard against duplicate visual loaders
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'nexa-final-ui-v18.js' nexa-hotfix.js | wc -l | tr -d ' ')" = "1"
          ! grep -q 'nexa-runtime-consolidated-v14.js' nexa-hotfix.js
          ! grep -q 'nexa-approved-ui-v15.js' nexa-hotfix.js
          ! grep -q 'nexa-parity-v17.js' nexa-hotfix.js
          echo 'Single visual shell: PASS'


  staging-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Staging authorization and clinical routes
        env:
          NEXA_STAGING_EMAIL: ${{ secrets.NEXA_STAGING_EMAIL }}
          NEXA_STAGING_PASSWORD: ${{ secrets.NEXA_STAGING_PASSWORD }}
        run: npm run test:staging-auth
