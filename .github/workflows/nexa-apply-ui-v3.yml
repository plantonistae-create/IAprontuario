name: NEXA apply UI v3
on:
  push:
    branches: [feature/nexa-ui-audit-reset-20260903]
    paths:
      - '.github/workflows/nexa-apply-ui-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nexa-ui-audit-reset-20260903
      - name: Inject UI v3 script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./nexa-ui-v3.js?v=20260903-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: load NEXA UI v3'
            git push origin HEAD:feature/nexa-ui-audit-reset-20260903
          fi
