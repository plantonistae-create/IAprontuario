name: NEXA P0 Source Authority Contract (Offline Only)

on:
  pull_request:
    branches:
      - review/g59-offline-only-20261109
    paths:
      - 'labs/nexa-audit-attestation/**'

permissions:
  contents: read

jobs:
  gate-c-atomic-delta-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate C candidate syntax (existing #42948229286 not repeated)
        run: |
          node --check labs/nexa-audit-attestation/gate-c-edge-offline.P0-CANDIDATE.mjs
          node --check labs/nexa-audit-attestation/gate-c-atomic.P0.test.mjs
      - name: Focused Gate C delta only - synthetic ports, no network
        run: node --test labs/nexa-audit-attestation/gate-c-atomic.P0.test.mjs
