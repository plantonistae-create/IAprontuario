name: NEXA P0 Source Authority Contract (Offline Only)

on:
  pull_request:
    branches:
      - review/g59-offline-only-20261109
    paths:
      - 'labs/nexa-audit-attestation/**'

permissions:
  contents: read

jobs:
  source-authority-contract-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax — no dependencies installed
        run: |
          node --check labs/nexa-audit-attestation/source-authority.P0-LAB-ONLY.mjs
          node --check labs/nexa-audit-attestation/source-authority.P0.test.mjs
      - name: Isolated synthetic source authorization tests — no staging / hosted calls
        run: node --test labs/nexa-audit-attestation/source-authority.P0.test.mjs
