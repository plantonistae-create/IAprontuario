name: NEXA G59-G61 Audit Evidence (Offline Only)

on:
  pull_request:
    branches:
      - review/g59-offline-only-20261109
    paths:
      - 'labs/nexa-audit-attestation/**'

permissions:
  contents: read

jobs:
  g59-synthetic-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline source and tests syntax
        run: |
          node --check labs/nexa-audit-attestation/receipt-verifier.G59-LAB-ONLY.mjs
          node --check labs/nexa-audit-attestation/receipt-verifier.G59.test.mjs
          node --check labs/nexa-audit-attestation/authority-model.G60-LAB-ONLY.mjs
          node --check labs/nexa-audit-attestation/authority-model.G60.test.mjs
          node --check labs/nexa-audit-attestation/source-inventory.G61-LAB-ONLY.mjs
          node --check labs/nexa-audit-attestation/source-inventory.G61.test.mjs
      - name: Offline synthetic verification only — no staging, SQL, API or dependencies
        run: node --test labs/nexa-audit-attestation/receipt-verifier.G59.test.mjs labs/nexa-audit-attestation/authority-model.G60.test.mjs labs/nexa-audit-attestation/source-inventory.G61.test.mjs
