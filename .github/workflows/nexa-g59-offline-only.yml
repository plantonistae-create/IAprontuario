name: NEXA P0 Audit Origin — Offline Only

on:
  pull_request:
    branches:
      - review/g59-offline-only-20261109
    paths:
      - 'labs/nexa-audit-attestation/p0-origin/**'

permissions:
  contents: read

jobs:
  p0-source-origin-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline-only syntax
        run: |
          node --check labs/nexa-audit-attestation/p0-origin/source-contract.P0-LAB-ONLY.mjs
          node --check labs/nexa-audit-attestation/p0-origin/source-contract.P0.test.mjs
      - name: Verify synthetic source ownership and transaction contract (no staging or dependencies)
        run: node --test labs/nexa-audit-attestation/p0-origin/source-contract.P0.test.mjs
