name: NEXA P0 Source Authority Contract (Offline Only)

on:
  pull_request:
    branches:
      - review/g59-offline-only-20261109
    paths:
      - 'labs/nexa-audit-attestation/**'

permissions:
  contents: read

jobs:
  gate-c-evidence-writer-delta-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New evidence writer syntax only - no old suites
        run: |
          node --check labs/nexa-audit-attestation/gate-c-evidence-writer-offline.P0-CANDIDATE.mjs
          node --check labs/nexa-audit-attestation/gate-c-evidence-writer.P0.test.mjs
      - name: Targeted evidence writer tests - fake server events only
        run: node --test labs/nexa-audit-attestation/gate-c-evidence-writer.P0.test.mjs
      - name: Bash syntax for local preflight (not executed)
        run: bash -n labs/nexa-audit-attestation/gate-c-local-preflight.P0.sh
